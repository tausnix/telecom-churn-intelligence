name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Artefact smoke test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all sources
        run: python -m compileall -q app.py run_pipeline.py src scripts

      - name: Load every trained model and score the sample customer
        run: python scripts/smoke_test.py

      - name: Score a customer through the CLI
        run: python -m src.predict --json examples/sample_customer.json

  pipeline:
    name: Full pipeline reproducibility
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the end-to-end pipeline
        run: python run_pipeline.py

      - name: Print headline metrics
        run: |
          python -c "import json; m=json.load(open('reports/metrics.json')); t=m['best_model_test_metrics_tuned_threshold']; print('best model :', m['best_model']); print('threshold  :', round(m['operating_threshold'],3)); print('recall     :', round(t['recall'],3)); print('accuracy   :', round(t['accuracy'],3)); print('roc auc    :', round(t['roc_auc'],3))"

      - name: Upload evaluation figures
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-figures
          path: reports/figures/
          if-no-files-found: error
